<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're invited to a listening party · KittyTune</title>
    <!--
      The page invite links point to. Link previews (Discord, WhatsApp, Telegram, iMessage…) read these tags
      without running scripts, so this page exists to give an invite its own card instead of the site's.
      A browser is sent straight on to the session.
    -->
    <meta name="description" content="Join a live KittyTune session: same song, same second, lyrics in sync. Right in your browser or the app, free and ad-free.">
    <meta name="theme-color" content="#8fb2ff">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KittyTune · Listen Together">
    <meta property="og:title" content="🎧 You're invited to a listening party">
    <meta property="og:description" content="Someone is playing music live on KittyTune and saved you a seat. Tap to join: same song, same second, lyrics in sync. No account, no ads.">
    <meta property="og:url" content="https://alan7383.github.io/kittytune-website/together/">
    <meta property="og:image" content="https://alan7383.github.io/kittytune-website/together/invite.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="KittyTune invitation: you're invited to a listening party, live now.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="🎧 You're invited to a listening party">
    <meta name="twitter:description" content="Join a live KittyTune session: same song, same second, lyrics in sync.">
    <meta name="twitter:image" content="https://alan7383.github.io/kittytune-website/together/invite.png">
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var raw = params.get('together') || params.get('code') || params.get('room') || '';
            var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
            var target = '../';
            if (code.length === 8) {
                target += '?together=' + code.slice(0, 4) + '-' + code.slice(4);
                var from = (params.get('from') || '').slice(0, 40);
                if (from) target += '&from=' + encodeURIComponent(from);
            } else {
                // No code: this is the site's own Together page (/together), which used to reach the app
                // through 404.html. Hand the path over the same way so the app opens that page.
                var path = window.location.pathname.replace(/\/$/, '');
                try { window.sessionStorage.setItem('kittytune_redirect', path); } catch (e) {}
                target += 'index.html';
            }
            window.location.replace(target);
        })();
    </script>
    <style>
        html, body { margin: 0; height: 100%; background: #0c0e14; color: #e3e2ea;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
        a { color: #0c0e14; background: #8fb2ff; padding: 12px 22px; border-radius: 999px;
            font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>You're invited to a listening party</h1>
        <p>Taking you to the session…</p>
        <a href="../">Open KittyTune</a>
    </main>
</body>
</html>
