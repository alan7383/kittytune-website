name: Deploy Kotlin Wasm to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper & caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Kotlin/Wasm toolchain (Node, Yarn, Binaryen)
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            kotlin-js-store
            build/kotlinTooling
          key: kotlin-wasm-toolchain-${{ runner.os }}-${{ hashFiles('kotlin-js-store/wasm/yarn.lock') }}
          restore-keys: kotlin-wasm-toolchain-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true   # we handle caching above

      - name: Build Web App
        run: ./gradlew wasmJsBrowserDistribution --no-daemon --configuration-cache

      - name: Copy Google verification file and SPA 404 fallback to site root
        run: |
          cp google64c8159730b14ee1.html build/dist/wasmJs/productionExecutable/
          cp 404.html build/dist/wasmJs/productionExecutable/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
